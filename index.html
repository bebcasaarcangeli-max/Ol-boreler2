<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b2a"><link rel="manifest" href="./manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OL BORÉLER"><link rel="icon" type="image/png" sizes="32x32" href="./assets-src/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="./assets-src/apple-touch-icon.png"><title>Ol Boréler</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102b2a;color:#f4e8c7;font-family:monospace;display:flex;min-height:100svh;align-items:center;justify-content:center;padding:12px}
main{width:min(100%,440px);text-align:center}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 2px}h1{font-size:clamp(18px,5.5vw,30px);letter-spacing:1.5px;margin:0;color:#f5d47b;white-space:nowrap}.audio-tools{display:flex;align-items:center;gap:5px;flex-shrink:0}p{margin:2px 0 8px;font-size:11px}
.hud{display:flex;justify-content:space-between;padding:8px 12px;background:#1c4540;border:3px solid #d5b879;font-size:14px}
canvas{display:block;width:100%;height:auto;max-height:68svh;aspect-ratio:3/5;background:#286b67;border:4px solid #d5b879;image-rendering:pixelated;touch-action:none}
.controls{display:flex;gap:12px;margin-top:10px}.controls button,#start,#audio{flex:1;background:#d5b879;color:#18312c;border:0;padding:14px;font:bold 18px monospace;touch-action:none;border-radius:4px}
#start{width:100%;margin-top:9px;font-size:15px}#audio{flex:0 0 auto;background:#315b50;color:#f4e8c7;border:2px solid #d5b879;padding:7px 8px;font:bold 10px monospace;border-radius:4px;white-space:nowrap}.volume{display:flex;align-items:center;gap:4px;padding:5px 6px;background:#1c4540;border:2px solid #d5b879;font:bold 9px monospace;white-space:nowrap}.volume input{width:55px;min-width:35px;margin:0;accent-color:#f5d47b}.volume output{width:25px;text-align:right}.hint{font-size:10px;opacity:.8;margin-top:8px}

#pause{background:#315b50;color:#f4e8c7;border:2px solid #d5b879;padding:7px 9px;font:bold 10px monospace;border-radius:4px;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(5,18,18,.92);z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:min(100%,380px);background:#1c4540;border:4px solid #d5b879;padding:20px;color:#f4e8c7;text-align:center}
.panel h2{color:#f5d47b;margin:0 0 12px}.panel input{width:100%;padding:12px;background:#102b2a;color:#fff;border:2px solid #d5b879;font:16px monospace;margin:8px 0}
.panel button{width:100%;padding:12px;margin-top:8px;background:#d5b879;color:#18312c;border:0;font:bold 15px monospace}.panel ol{padding-left:28px;text-align:left;line-height:1.8}.panel .small{font-size:11px;opacity:.8}.hidden{display:none!important}
</style></head>
<body><div id="welcome" class="overlay"><section class="panel"><h2>OL BORÉLER</h2><p>LA CORSA SULL’ACQUA</p><p class="small">Scegli il tuo nickname per entrare nella classifica globale.</p><input id="nickname" maxlength="20" autocomplete="nickname" placeholder="Il tuo nickname"><button id="enter">ENTRA NEL GIOCO</button></section></div><div id="pauseScreen" class="overlay hidden"><section class="panel"><h2>PAUSA</h2><h3>CLASSIFICA GLOBALE</h3><div id="leaderboard">Caricamento classifica…</div><p class="small" id="boardStatus"></p><button id="resume">RIPRENDI LA DISCESA</button><button id="backHome">TORNA ALL’INIZIO</button></section></div><main><div class="topbar"><h1>OL BORÉLER</h1><div class="audio-tools"><button id="pause" disabled>PAUSA</button><button id="install" hidden style="background:#f5d47b;color:#18312c;border:0;padding:7px 8px;font:bold 10px monospace;border-radius:4px">INSTALLA</button><button id="audio" aria-pressed="false">AUDIO: OFF</button><label class="volume" for="volume">VOL <input id="volume" type="range" min="0" max="100" value="65"><output id="volumeValue">65%</output></label></div></div><p>LA CORSA SULL'ACQUA</p>
<div class="hud"><span>PUNTI <b id="score">0</b></span><span>VITE <b id="lives">3</b></span><span>RECORD <b id="best">0</b></span></div>
<canvas id="game" width="240" height="400" aria-label="Gioco Ol Boréler"></canvas>
<div class="controls"><button id="left" aria-label="Sinistra">◀</button><button id="right" aria-label="Destra">▶</button></div>
<button id="start">INIZIA LA DISCESA</button><div class="hint">Usa i pulsanti o le frecce della tastiera. Schiva sassi, tronchi e rapide!</div><div id="scoreStatus" class="hint" aria-live="polite"></div>
</main>
<script type="module">
import { createSidEngine } from "./audio-engine.js";
(()=>{
const sid = createSidEngine();
let installPrompt=null;const installBtn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.hidden=true});window.addEventListener('appinstalled',()=>{installBtn.hidden=true});if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
const c=document.getElementById('game'),x=c.getContext('2d'),W=240,H=400;
const $=id=>document.getElementById(id);let player=120,held=0,items=[],score=0,lives=3,best=+(localStorage.olBorelerBest||0),speed=1,spawn=0,running=false,last=0,water=0,raf=0,feedback=0,nickname=localStorage.olBorelerNick||'',playerId=localStorage.olBorelerPlayer||crypto.randomUUID(),gameSessionId=null;localStorage.olBorelerPlayer=playerId;$('nickname').value=nickname;
$('best').textContent=best;
function river(){x.fillStyle='#246b75';x.fillRect(0,0,W,H);x.fillStyle='#3e9ba0';for(let i=0;i<12;i++){let y=(i*43+water*1.3)%H,xx=20+(i*37)%190;x.fillRect(xx,y,13,2);x.fillRect(xx+5,y+7,7,2)}x.fillStyle='#d8c28b';x.fillRect(0,0,10,H);x.fillRect(230,0,10,H);x.fillStyle='#6c684f';for(let y=0;y<H;y+=24){let yy=(y+water)%H;x.fillRect(1,yy,8,11);x.fillRect(231,yy+8,8,10)}x.fillStyle='#ffffff';for(let i=0;i<5;i++){let yy=(i*91+water*1.8)%H;x.fillRect(14+(i%2)*4,yy,8,2);x.fillRect(218-(i%2)*4,yy+5,8,2)}}
function drawPlayer(){x.fillStyle='#4a2c1c';x.fillRect(player-19,350,38,7);x.fillStyle='#9a6335';for(let i=0;i<4;i++){x.fillRect(player-17+i*9,344,8,12);x.fillStyle='#d49a53';x.fillRect(player-16+i*9,346,2,8);x.fillStyle='#9a6335'}x.fillStyle='#d5a66b';x.fillRect(player-11,330,22,15);x.fillStyle='#315344';x.fillRect(player-9,329,18,12);x.fillStyle='#e5bd8a';x.fillRect(player-7,315,14,15);x.fillStyle='#6a3e27';x.fillRect(player-9,319,4,10);x.fillRect(player+5,319,4,10);x.fillStyle='#29221c';x.fillRect(player-7,312,14,4);x.fillRect(player-12,310,24,3);x.fillStyle='#c99a53';x.fillRect(player-8,307,16,3);x.fillStyle='#2a211a';x.fillRect(player-4,320,2,2);x.fillRect(player+3,320,2,2);x.fillStyle='#9b4e35';x.fillRect(player-2,324,5,2);x.fillStyle='#75452c';x.fillRect(player-7,327,14,3);x.fillStyle='#b98245';x.fillRect(player+10,321,3,25);x.fillStyle='#e0c28a';x.fillRect(player+12,309,2,18)}
function obstacle(o){x.fillStyle=o.type===0?'#77766b':o.type===1?'#70472d':'#b7a16d';if(o.type===0){x.fillRect(o.x-10,o.y-8,20,16);x.fillRect(o.x-7,o.y-12,14,4)}else if(o.type===1){x.fillRect(o.x-20,o.y-5,40,10);x.fillStyle='#493322';x.fillRect(o.x-16,o.y-2,32,3)}else{x.fillRect(o.x-20,o.y-7,40,14);x.fillStyle='#e5d6a7';x.fillRect(o.x-15,o.y-2,30,3)}}
function face(cx,cy,scale){x.save();x.translate(cx,cy);x.scale(scale,scale);x.fillStyle='#30251d';x.fillRect(-20,-20,40,40);x.fillStyle='#e4b27b';x.fillRect(-15,-15,30,28);x.fillStyle='#5a3827';x.fillRect(-17,-18,34,8);x.fillRect(-19,-12,7,22);x.fillRect(12,-12,7,22);x.fillStyle='#29221d';x.fillRect(-10,-5,5,5);x.fillRect(6,-5,5,5);x.fillStyle='#fff';x.fillRect(-9,-5,2,2);x.fillRect(7,-5,2,2);x.fillStyle='#b66a48';x.fillRect(-3,1,7,6);x.fillStyle='#40251e';x.fillRect(-8,11,16,8);x.fillStyle='#f1d0a0';x.fillRect(-5,12,10,3);x.fillStyle='#d7a65d';x.fillRect(-22,-23,44,5);x.fillRect(-14,-29,28,7);x.restore()}
function shout(){x.fillStyle='rgba(8,20,23,.78)';x.fillRect(13,119,214,142);x.fillStyle='#f5d47b';x.fillRect(17,123,206,134);face(67,184,1.35);x.fillStyle='#fff8df';x.fillRect(113,139,99,82);x.fillStyle='#211c18';x.font='bold 13px monospace';x.textAlign='center';x.fillText('POTA CHE',162,164);x.fillText('SFIGA!',162,184);x.fillStyle='#f5d47b';x.font='bold 9px monospace';x.fillText('HAI PRESO UN TRONCO!',162,204);x.textAlign='left'}
async function loadBoard(){const el=$('leaderboard');el.textContent='Caricamento…';try{const r=await fetch('https://aletrouyvezkvtqrauwj.supabase.co/rest/v1/rpc/get_global_leaderboard',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_sgEUud3N-t7Pt-PXhdnPFQ_MbV4vf4t','Authorization':'Bearer sb_publishable_sgEUud3N-t7Pt-PXhdnPFQ_MbV4vf4t'},body:JSON.stringify({p_limit:10})});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();el.replaceChildren();if(!rows.length){el.textContent='Ancora nessun punteggio. Sii il primo!';return}const ol=document.createElement('ol');for(const row of rows){const li=document.createElement('li');li.textContent=String(row.nickname)+' — '+Number(row.best_score);ol.appendChild(li)}el.appendChild(ol);$('boardStatus').textContent='Classifica globale'}catch(e){el.textContent='Classifica momentaneamente non disponibile.';$('boardStatus').textContent='Controlla la connessione e riprova.'}}
async function submitScore(){const status=$('scoreStatus');const finalScore=Math.floor(score);if(!nickname||finalScore<1||!gameSessionId){status.textContent='Punteggio non inviato: sessione o punteggio non valido.';return false}status.textContent='Verifica e invio del punteggio…';try{const r=await fetch('https://aletrouyvezkvtqrauwj.supabase.co/functions/v1/ol-boreler-score',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_sgEUud3N-t7Pt-PXhdnPFQ_MbV4vf4t'},body:JSON.stringify({action:'submit',player_id:playerId,session_id:gameSessionId,nickname,score:finalScore})});const result=await r.json();if(!r.ok||result.accepted!==true)throw Error(result.error||'Punteggio rifiutato');status.textContent='Punteggio verificato e inviato alla classifica globale.';return true}catch(e){console.warn('Invio punteggio non riuscito',e);status.textContent='Punteggio non accettato: '+(e.message||'errore di connessione');return false}}
function hud(){$('score').textContent=Math.floor(score);$('lives').textContent=lives;$('best').textContent=best}
async function reset(){running=false;cancelAnimationFrame(raf);const status=$('scoreStatus');status.textContent='Apertura sessione di gioco…';gameSessionId=null;try{const sr=await fetch('https://aletrouyvezkvtqrauwj.supabase.co/functions/v1/ol-boreler-score',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_sgEUud3N-t7Pt-PXhdnPFQ_MbV4vf4t'},body:JSON.stringify({action:'start',player_id:playerId})});const sd=await sr.json();if(!sr.ok||!sd.session_id)throw Error(sd.error||'sessione non disponibile');gameSessionId=sd.session_id;status.textContent='';}catch(e){status.textContent='Sessione non disponibile: il punteggio di questa partita non potrà essere registrato.';console.warn('Avvio sessione fallito',e)}$('welcome').classList.add('hidden');$('pauseScreen').classList.add('hidden');$('pause').disabled=false;$('pause').textContent='PAUSA';player=120;items=[];score=0;lives=3;speed=1;spawn=0;feedback=0;running=true;$('start').textContent='RICOMINCIA';last=0;hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67||1,2);last=t;score+=dt*speed*.12;speed=Math.min(3.3,1+score/260);water=(water+2.2*speed*dt)%H;spawn-=dt;if(spawn<=0){let lane=28+Math.random()*184;items.push({x:lane,y:-20,type:Math.floor(Math.random()*3),hit:false});spawn=Math.max(19,48-speed*9)+Math.random()*20}
player=Math.max(25,Math.min(215,player+held*2.9*dt*speed));
for(let o of items){o.y+=2.2*speed*dt;if(!o.hit&&o.y>315&&o.y<355&&Math.abs(o.x-player)<(o.type===1?27:22)){o.hit=true;sid.collision();lives--;feedback=75;hud();if(lives<=0){running=false;$('pause').disabled=true;submitScore();best=Math.max(best,Math.floor(score));localStorage.olBorelerBest=best;hud();$('start').textContent='RIPROVA';draw();shout();x.fillStyle='#fff8df';x.textAlign='center';x.font='bold 10px monospace';x.fillText('DISCESA FINITA  -  PUNTI '+Math.floor(score),120,246);return}}}
items=items.filter(o=>o.y<H+20);draw();if(feedback>0){shout();feedback-=dt}hud();raf=requestAnimationFrame(loop)}
function draw(){river();for(let o of items)obstacle(o);drawPlayer()}
$('audio').addEventListener('click',async()=>{
 const on=await sid.toggle();
 $('audio').textContent='AUDIO: '+(on?'ON':'OFF');
 $('audio').setAttribute('aria-pressed',String(on));
});
$('volume').addEventListener('input',e=>{sid.setVolume(e.target.value/100);$('volumeValue').textContent=e.target.value+'%'});
sid.setVolume(0.65);
function setHold(v){held=v}
[['left',-1],['right',1]].forEach(([id,v])=>{let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();setHold(v)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(held===v)setHold(0)}))});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setHold(e.key==='ArrowLeft'?-1:1)}if(e.key===' '&&!running)reset()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')setHold(0)});
$('start').addEventListener('click',reset);$('enter').addEventListener('click',()=>{const n=$('nickname').value.trim();if(!n){$('nickname').focus();return}nickname=n.slice(0,20);localStorage.olBorelerNick=nickname;reset()});$('pause').addEventListener('click',()=>{if(!running)return;running=false;held=0;cancelAnimationFrame(raf);$('pauseScreen').classList.remove('hidden');loadBoard()});$('resume').addEventListener('click',()=>{if(running)return;$('pauseScreen').classList.add('hidden');running=true;last=0;raf=requestAnimationFrame(loop)});$('backHome').addEventListener('click',()=>{running=false;$('pauseScreen').classList.add('hidden');$('welcome').classList.remove('hidden');$('pause').disabled=true});$('pause').disabled=true;draw();})();
</script></body></html>
